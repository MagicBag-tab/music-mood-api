services:
  db:
    image: postgres:15
    env_file: 
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/ddl_music_tracker.sql:/docker-entrypoint-initdb.d/01_ddl.sql
      - ./db/dml_music_tracker.sql:/docker-entrypoint-initdb.d/02_dml.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    env_file: 
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8009:8009"
    volumes:
      - uploads_data:/app/uploads


volumes:
  db_data:
  uploads_data: