services:
  db:
    image: postgres:15
    env_file: 
      - .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/ddl_music_tracker.sql:/docker-entrypoint-initdb.d/ddl_music_tracker.sql

  backend:
    build: .
    env_file: 
      - .env
    depends_on:
      - db
    ports:
      - "8009:8009"

volumes:
  db_data: